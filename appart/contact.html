<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Studio Urbain</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero small-hero">
    <div class="hero-overlay"></div>
    <div class="hero-inner">
      <p class="eyebrow">Contact</p>
      <h1>Réservez une visite</h1>
    </div>
  </header>

  <nav class="topnav">
    <a href="index.html">Accueil</a>
    <a href="appartement.html">Appartement</a>
    <a href="chambre.html">Chambre</a>
    <a href="salon.html">Salon</a>
    <a href="cuisine.html">Cuisine</a>
    <a href="salle-de-bain.html">Salle de bain</a>
    <a href="equipement.html">Équipement</a>
    <a href="localisation.html">Localisation</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main>
    <section class="section contact">
      <span class="section-label">Contact</span>
      <h2>Intéressé(e) ? Contactez-nous</h2>
      <p>Envoyez un message ou réservez une visite. Nous répondons rapidement.</p>
      <form class="contact-form" action="#" method="post">
        <div class="form-group">
          <label for="name">Nom</label>
          <input type="text" id="name" name="name" placeholder="Votre nom" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="adresse@mail.com" required />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" placeholder="Je souhaite visiter le studio..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Envoyer</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>Studio Urbain · Location d'appartement</p>
  </footer>
</body>
</html>
